name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Job name must stay `test (<os>)` — the branch-protection ruleset requires those exact
  # contexts. Do not add matrix dimensions to the name (a rename orphans the required check).
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: gofmt (must be clean)
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: build
        run: go build ./...

      - name: test (race)
        run: go test -race ./...

  min-version:
    # The minimum Go the module claims (go.mod: go 1.22) — build + test, guarding against
    # accidental use of newer stdlib/language features. Separate job (not part of the `test`
    # matrix name) so the required-check contexts stay stable.
    name: test (go 1.22 minimum)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
      - name: build
        run: go build ./...
      - name: test
        run: go test ./...

  crosscompile:
    name: cross-compile (mmap build tags)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - name: build every target
        run: |
          set -e
          for target in linux/amd64 linux/arm64 darwin/arm64 windows/amd64; do
            echo "== $target =="
            GOOS=${target%/*} GOARCH=${target#*/} go build ./...
          done

      - name: build for the browser (js/wasm)
        run: GOOS=js GOARCH=wasm go build ./...

  webui:
    name: web ui build + security checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: install + build the React UI
        working-directory: ui
        run: |
          npm ci
          npm run build
      - name: RuleGarden web security checks (node, no browser)
        # Guards P0-1: no untrusted string may reach innerHTML in the RuleGarden page, and the
        # DOM renderer must reject an event-handler payload. See web/rulegarden/security.test.mjs.
        run: node web/rulegarden/security.test.mjs
