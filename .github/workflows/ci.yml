name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: gofmt (must be clean)
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: build
        run: go build ./...

      - name: test (race)
        if: matrix.os == 'ubuntu-latest'
        run: go test -race ./...

      # Go's race-instrumented test binary aborts on the hosted macOS runner
      # before tests execute (dyld: missing LC_UUID). Ubuntu remains the race
      # detector gate; macOS still verifies the ordinary test suite.
      - name: test
        if: matrix.os == 'macos-latest'
        run: go test ./...

  crosscompile:
    name: cross-compile (mmap build tags)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
      - name: build every target
        run: |
          set -e
          for target in linux/amd64 linux/arm64 darwin/arm64 windows/amd64; do
            echo "== $target =="
            GOOS=${target%/*} GOARCH=${target#*/} go build ./...
          done
